# Source of truth for the Xcode project. The .xcodeproj is generated and committed;
# the Vocab/ folder is a synced folder, so files added in Xcode need no regeneration.
name: Vocab
options:
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
targets:
  Vocab:
    type: application
    platform: iOS
    sources:
      - path: Vocab
        type: syncedFolder
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Vocab
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Vocab listens while you dictate a question about a word.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Vocab turns your dictated question into text, on your device when possible.
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
