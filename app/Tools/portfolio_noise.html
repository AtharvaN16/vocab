<!doctype html><html><head><style>
html,body{margin:0;padding:0;background:#fff}body{height:384px;position:relative}
/* Two 384x384 tiles: one 128 pt tile at @3x. baseFrequency 0.65 per CSS px on the site
   = 0.65/3 per device px at @3x, so the grain is the same physical size as on the site. */
.t{position:absolute;top:0;width:384px;height:384px;overflow:hidden}
.l{left:0;background:#f4f4f4}.d{left:384px;background:#000}
.n{position:absolute;inset:0}
.l .n{opacity:.2;filter:url(#g) brightness(1)}
.d .n{opacity:.025;filter:url(#g) brightness(1.2)}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><filter id="g" x="0" y="0" width="100%" height="100%" filterUnits="objectBoundingBox">
<feTurbulence type="fractalNoise" baseFrequency="0.21667" numOctaves="2" stitchTiles="stitch"/>
<feColorMatrix type="saturate" values="0"/></filter></svg>
<div class="t l"><div class="n"></div></div><div class="t d"><div class="n"></div></div>
</body></html>
