<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Card Type Tuner</title>
<style>
.app {
  --card: #eaeaea; --control: #e6e6e6; --behind: #f4f4f4;
  --ink: #121212; --ink2: #424242; --ink3: #808080; --ink4: #a3a3a3; --grain-op: .09;
}
@media (prefers-color-scheme: dark) {
  .app:not([data-theme="light"]) {
    --card: #1c1c1c; --control: #292929; --behind: #000;
    --ink: #f5f5f5; --ink2: #cccccc; --ink3: #999999; --ink4: #6b6b6b; --grain-op: .06;
  }
}
.app[data-theme="dark"] {
  --card: #1c1c1c; --control: #292929; --behind: #000;
  --ink: #f5f5f5; --ink2: #cccccc; --ink3: #999999; --ink4: #6b6b6b; --grain-op: .06;
}
:root {
  --fg: var(--foreground, #161616);
  --muted-fg: var(--muted-foreground, #6b6b6b);
  --line: var(--border, rgba(127,127,127,.28));
}
* { box-sizing: border-box; }
body { margin: 0; font-family: var(--font-sans, -apple-system, BlinkMacSystemFont, system-ui, sans-serif); color: var(--fg); }

.controls { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 28px; margin-bottom: 14px; }
@media (max-width: 560px) { .controls { grid-template-columns: 1fr; } }
.group { display: grid; gap: 10px; }
.group h3 + h4 { margin-top: 2px; }
.group h4 { margin: 4px 0 0; font-size: 12px; font-weight: 500; color: var(--muted-fg); }
.group h3 { margin: 0; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted-fg); }
.ctl { display: grid; grid-template-columns: 52px 1fr 92px; align-items: center; gap: 10px; font-size: 13px; }
.ctl label { color: var(--muted-fg); }
.ctl output { font-variant-numeric: tabular-nums; font-weight: 600; text-align: right; white-space: nowrap; }
input[type=range] { width: 100%; accent-color: currentColor; height: 28px; }

.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 18px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px; }
.seg button, .btn { font: inherit; font-size: 13px; font-weight: 500; color: var(--muted-fg); background: none; border: 0; padding: 7px 12px; border-radius: 999px; cursor: pointer; }
.seg button[aria-pressed="true"] { color: var(--fg); background: var(--line); }
.btn { border: 1px solid var(--line); }
.spacer { flex: 1; }

.phones { display: flex; gap: 24px; justify-content: center; flex-wrap: wrap; }
figure.phone { margin: 0; }
.phone figcaption { text-align: center; font-size: 13px; font-weight: 600; margin-top: 10px; }
.stage { position: relative; width: calc(390px * var(--s)); height: calc(844px * var(--s)); border-radius: calc(54px * var(--s)); overflow: hidden;
  box-shadow: 0 0 0 1px var(--line), 0 18px 40px -20px rgba(0,0,0,.35); --s: .8; }
.screen { position: absolute; left: 0; top: 0; width: 390px; height: 844px; transform: scale(var(--s)); transform-origin: 0 0;
  background: var(--behind); color: var(--ink); overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", system-ui, sans-serif; }
.island { position: absolute; top: 11px; left: 50%; width: 124px; height: 36px; margin-left: -62px; background: #000; border-radius: 20px; z-index: 5; }
.clock { position: absolute; top: 20px; left: 48px; font-size: 17px; font-weight: 600; z-index: 5; }
.grain::after { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: var(--grain-op); border-radius: inherit;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5 0 0 0 0 .5 0 0 0 0 .5 0 0 0 1 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }

/* Each screen reads its own four values, set from its own sliders. */
.w { font-size: var(--w-size, 52px); font-weight: var(--w-weight, 700); line-height: 1.15; letter-spacing: -.01em; margin: 0; overflow-wrap: anywhere; }
.d { font-size: var(--d-size, 32px); font-weight: var(--d-weight, 700); line-height: 1.19; color: var(--ink3); margin: 0; }

/* Deck */
.menu { position: absolute; top: 62px; left: 24px; z-index: 2; }
.deckcard { position: absolute; left: 24px; right: 24px; top: 150px; height: 479px; background: var(--card); border-radius: 28px; padding: 32px; overflow: hidden; }
.deckcard .w { margin-bottom: 20px; }
.deckbar { position: absolute; left: 24px; right: 24px; bottom: 42px; display: flex; align-items: center; justify-content: space-between; }
.count { font-size: 34px; font-weight: 700; font-variant-numeric: tabular-nums; }
.count span { color: var(--ink3); }
.circle64 { width: 64px; height: 64px; border-radius: 50%; background: var(--control); display: grid; place-items: center; }

/* Detail */
.detail { position: absolute; inset: 0; background: var(--card); }
.dx { position: absolute; top: 67px; left: 32px; width: 36px; height: 36px; border-radius: 50%; background: var(--control); display: grid; place-items: center; }
.dbody { position: absolute; left: 32px; right: 32px; top: 131px; }
.dhead { display: flex; align-items: center; gap: 8px; margin-bottom: 20px; }
.speak { width: 44px; height: 44px; display: grid; place-items: center; color: var(--ink3); flex: none; }
.defs { display: grid; gap: 22px; }
.dbar { position: absolute; left: 24px; right: 24px; bottom: 42px; }
.segs { display: flex; gap: 5px; margin-bottom: 22px; }
.segs i { flex: 1; height: 4px; border-radius: 2px; background: var(--ink4); opacity: .35; }
.segs i.on { background: var(--ink); opacity: 1; }
.next { height: 56px; border-radius: 28px; background: var(--control); display: flex; align-items: center; justify-content: space-between; padding: 0 22px; font-size: 18px; font-weight: 600; }

.swift { margin-top: 18px; font-family: var(--font-mono, ui-monospace, Menlo, monospace); font-size: 12.5px; line-height: 1.6;
  padding: 12px 16px; border-radius: var(--radius, 10px); background: var(--code-background, rgba(127,127,127,.1)); overflow-x: auto; white-space: pre; }
</style>
</head>
<body>
  <div class="controls">
    <div class="group" data-screen="deck">
      <h3>Deck card</h3>
      <h4>Word</h4>
      <div class="ctl"><label>Size</label><input data-k="ws" type="range" min="28" max="72" step="1" value="48"><output data-o="ws"></output></div>
      <div class="ctl"><label>Weight</label><input data-k="ww" type="range" min="100" max="900" step="100" value="700"><output data-o="ww"></output></div>
      <h4>Definition</h4>
      <div class="ctl"><label>Size</label><input data-k="ds" type="range" min="16" max="44" step="1" value="30"><output data-o="ds"></output></div>
      <div class="ctl"><label>Weight</label><input data-k="dw" type="range" min="100" max="900" step="100" value="700"><output data-o="dw"></output></div>
    </div>
    <div class="group" data-screen="detail">
      <h3>Word detail page</h3>
      <h4>Word</h4>
      <div class="ctl"><label>Size</label><input data-k="ws" type="range" min="28" max="72" step="1" value="44"><output data-o="ws"></output></div>
      <div class="ctl"><label>Weight</label><input data-k="ww" type="range" min="100" max="900" step="100" value="700"><output data-o="ww"></output></div>
      <h4>Definitions</h4>
      <div class="ctl"><label>Size</label><input data-k="ds" type="range" min="16" max="44" step="1" value="28"><output data-o="ds"></output></div>
      <div class="ctl"><label>Weight</label><input data-k="dw" type="range" min="100" max="900" step="100" value="600"><output data-o="dw"></output></div>
    </div>
  </div>
  <div class="row">
    <div class="seg" role="group" aria-label="Word">
      <button data-word="0" aria-pressed="true">lambent</button>
      <button data-word="1" aria-pressed="false">perspicacious</button>
      <button data-word="2" aria-pressed="false">sesquipedalian</button>
    </div>
    <div class="seg" role="group" aria-label="Appearance">
      <button data-theme-btn="light" aria-pressed="true">Light</button>
      <button data-theme-btn="dark" aria-pressed="false">Dark</button>
    </div>
    <span class="spacer"></span>
    <button class="btn" id="copy">Detail = deck</button>
    <button class="btn" id="reset">Reset to current</button>
  </div>

  <div class="phones">
    <figure class="phone">
      <div class="stage app" data-theme="light" data-screen="deck">
        <div class="screen">
          <div class="island"></div><div class="clock">9:41</div>
          <svg class="menu" width="22" height="18" viewBox="0 0 22 18"><path d="M2 2h18M2 9h18M2 16h18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
          <div class="deckcard grain">
            <p class="w" data-slot="word"></p>
            <p class="d" data-slot="def0"></p>
          </div>
          <div class="deckbar">
            <div class="count">1<span>/24</span></div>
            <div class="circle64"><svg width="22" height="22" viewBox="0 0 22 22"><circle cx="9.5" cy="9.5" r="7" stroke="currentColor" stroke-width="2.4" fill="none"/><path d="M15 15l5 5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></div>
          </div>
        </div>
      </div>
      <figcaption>Deck card</figcaption>
    </figure>

    <figure class="phone">
      <div class="stage app" data-theme="light" data-screen="detail">
        <div class="screen">
          <div class="detail grain"></div>
          <div class="island"></div><div class="clock">9:41</div>
          <div class="dx"><svg width="15" height="15" viewBox="0 0 15 15"><path d="M3 3l9 9M12 3l-9 9" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></div>
          <div class="dbody">
            <div class="dhead">
              <p class="w" data-slot="word"></p>
              <div class="speak"><svg width="22" height="18" viewBox="0 0 22 18"><path d="M1 6h4l5-5v16l-5-5H1z" fill="currentColor"/><path d="M13.5 5.5a4.6 4.6 0 0 1 0 7M16.5 2.5a8.8 8.8 0 0 1 0 13" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg></div>
            </div>
            <div class="defs">
              <p class="d" data-slot="def0"></p>
              <p class="d" data-slot="def1"></p>
              <p class="d" data-slot="def2"></p>
            </div>
          </div>
          <div class="dbar">
            <div class="segs"><i class="on"></i><i></i><i></i><i></i><i></i><i></i></div>
            <div class="next"><span>In a sentence</span><svg width="10" height="16" viewBox="0 0 10 16"><path d="M2 2l6 6-6 6" stroke="currentColor" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
          </div>
        </div>
      </div>
      <figcaption>Word detail · Definitions page</figcaption>
    </figure>
  </div>

  <div class="swift" id="swift"></div>

<script>
const WORDS = [
  { w: 'lambent', d: ['Of light or fire: glowing or flickering softly.', 'Of wit: lightly brilliant.', 'Of eyes or the sky: softly bright.'] },
  { w: 'perspicacious', d: ['Having a ready insight into and understanding of things.', 'Clear-sighted; seeing clearly.', ''] },
  { w: 'sesquipedalian', d: ['Of a word: long, and having many syllables.', 'Given to using long words.', ''] },
];
const NAMES = { 100: 'ultraLight', 200: 'thin', 300: 'light', 400: 'regular', 500: 'medium', 600: 'semibold', 700: 'bold', 800: 'heavy', 900: 'black' };
const $ = id => document.getElementById(id);
let wordIdx = 0;
const DEFAULTS = { deck: { ws: 48, ww: 700, ds: 30, dw: 700 }, detail: { ws: 44, ww: 700, ds: 28, dw: 600 } };
const val = (screen, k) => +document.querySelector(`.group[data-screen="${screen}"] [data-k="${k}"]`).value;

function update() {
  const out = {};
  for (const screen of ['deck', 'detail']) {
    const v = { ws: val(screen, 'ws'), ww: val(screen, 'ww'), ds: val(screen, 'ds'), dw: val(screen, 'dw') };
    out[screen] = v;
    const stage = document.querySelector(`.stage[data-screen="${screen}"]`);
    stage.style.setProperty('--w-size', v.ws + 'px'); stage.style.setProperty('--w-weight', v.ww);
    stage.style.setProperty('--d-size', v.ds + 'px'); stage.style.setProperty('--d-weight', v.dw);
    const g = document.querySelector(`.group[data-screen="${screen}"]`);
    g.querySelector('[data-o="ws"]').textContent = v.ws + ' pt';
    g.querySelector('[data-o="ww"]').textContent = `${v.ww} · ${NAMES[v.ww]}`;
    g.querySelector('[data-o="ds"]').textContent = v.ds + ' pt';
    g.querySelector('[data-o="dw"]').textContent = `${v.dw} · ${NAMES[v.dw]}`;
  }
  const f = (name, size, w) => `static let ${name} = Font.system(size: ${size}, weight: .${NAMES[w]})`;
  const k = out.deck, t = out.detail;
  const same = k.ws === t.ws && k.ww === t.ww && k.ds === t.ds && k.dw === t.dw;
  $('swift').textContent = same
    ? `// Both screens at the same values\n${f('cardWordFont', k.ws, k.ww)}\n${f('cardDefinitionFont', k.ds, k.dw)}`
    : `// Deck card\n${f('cardWordFont', k.ws, k.ww)}\n${f('cardDefinitionFont', k.ds, k.dw)}\n\n// Word detail page\n${f('detailWordFont', t.ws, t.ww)}\n${f('detailDefinitionFont', t.ds, t.dw)}`;
}
function fill() {
  const e = WORDS[wordIdx];
  document.querySelectorAll('[data-slot="word"]').forEach(n => n.textContent = e.w);
  ['def0', 'def1', 'def2'].forEach((k, i) => document.querySelectorAll(`[data-slot="${k}"]`).forEach(n => {
    n.textContent = e.d[i]; n.hidden = !e.d[i];
  }));
}
document.querySelectorAll('[data-k]').forEach(i => i.addEventListener('input', update));
$('reset').addEventListener('click', () => { document.querySelectorAll('.group[data-screen]').forEach(g => g.querySelectorAll('[data-k]').forEach(i => i.value = DEFAULTS[g.dataset.screen][i.dataset.k])); update(); });
$('copy').addEventListener('click', () => {
  document.querySelectorAll('.group[data-screen="detail"] [data-k]').forEach(i => i.value = val('deck', i.dataset.k));
  update();
});
document.querySelectorAll('[data-word]').forEach(b => b.addEventListener('click', () => {
  wordIdx = +b.dataset.word;
  document.querySelectorAll('[data-word]').forEach(x => x.setAttribute('aria-pressed', x === b));
  fill();
}));
document.querySelectorAll('[data-theme-btn]').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('[data-theme-btn]').forEach(x => x.setAttribute('aria-pressed', x === b));
  document.querySelectorAll('.app').forEach(a => a.setAttribute('data-theme', b.dataset.themeBtn));
}));
/* Fit the phones to the frame: two side by side when there's room. */
function fit() {
  const w = document.querySelector('.phones').clientWidth;
  const s = Math.min(0.8, Math.max(0.5, (w >= 560 ? (w - 24) / 2 : w) / 390));
  document.querySelectorAll('.stage').forEach(st => st.style.setProperty('--s', s.toFixed(3)));
}
addEventListener('resize', fit);
fill(); update(); fit();
</script>
</body>
</html>
